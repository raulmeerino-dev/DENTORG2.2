[project]
name = "dentcore-backend"
version = "0.1.0"
description = "Backend de DentCore para gestion integral de clinica dental"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.3.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # Long clinical/API texts are easier to review unwrapped in this codebase.
    "B008",  # FastAPI intentionally uses Depends/Query/Form/File in endpoint signatures.
    "UP017", # Keep timezone.utc until the project drops Python 3.11 support.
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = [
    "I001",  # Historical Alembic revisions keep generated import blocks stable.
    "UP007", # Old revision annotations are left untouched to avoid noisy migration churn.
    "UP012", # Hash canonicalization in older migrations stays byte-for-byte stable.
    "UP035", # Some generated revisions still use typing imports from their template.
]
"scripts/seed_*.py" = [
    "E402", # Seed scripts prepend backend root to sys.path before importing app modules.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
